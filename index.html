<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solopass v1 — Animated Portfolio Landing</title>
  <meta name="description" content="An early animated, interactive landing page for Solopass — neon hero, typewriter service reel, floating emojis, and a particle field. A v1 experiment, preserved." />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap');

    :root {
      --primary: #00FFFF;
      --secondary: #FF00FF;
      --tertiary: #FFFF00;
      --background: #0A0A0A;
      --text: #F0F0F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--background);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }

    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 2rem; position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(10px);
    }
    nav a { color: var(--text); text-decoration: none; font-weight: bold; transition: color 0.3s ease; }
    nav a:hover { color: var(--primary); }
    .logo { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--primary); }

    .hero {
      height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; position: relative; overflow: hidden;
    }
    .hero-content { z-index: 2; }
    .hero h1 {
      font-family: 'Orbitron', sans-serif; font-size: 4rem; margin-bottom: 1rem;
      background: linear-gradient(45deg, var(--primary), var(--secondary), var(--tertiary));
      background-size: 200% 200%;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      animation: gradient-shift 10s ease infinite;
    }
    @keyframes gradient-shift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    .ai-text-generator {
      font-size: 2.5rem; min-height: 3em; margin-bottom: 2rem; position: relative;
      transition: color 0.3s ease; display: flex; justify-content: center; align-items: center;
    }
    .ai-text-generator span { position: relative; }
    .ai-text-generator span::after { content: '|'; position: absolute; right: -10px; top: 0; animation: blink 0.7s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .cta-button {
      display: inline-block; padding: 1rem 2rem; background-color: var(--primary); color: var(--background);
      text-decoration: none; border-radius: 50px; font-weight: bold; cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .cta-button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 255, 255, 0.3); }

    #particles-js { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 1; }

    .floating-emoji { position: absolute; font-size: 3rem; z-index: 3; transition: all 0.3s ease; cursor: pointer; user-select: none; }
    @keyframes float { 0% { transform: translate(0, 0) rotate(0deg); } 33% { transform: translate(10px, -10px) rotate(10deg); } 66% { transform: translate(-5px, 5px) rotate(-5deg); } 100% { transform: translate(0, 0) rotate(0deg); } }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

    .services { padding: 6rem 0; position: relative; z-index: 2; }
    .services h2 {
      font-family: 'Orbitron', sans-serif; text-align: center; font-size: 2.5rem; margin-bottom: 3rem;
      color: var(--primary);
    }
    .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; }
    .service-card {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(0, 255, 255, 0.15);
      border-radius: 16px; padding: 2rem 1.5rem; text-align: center; transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .service-card:hover { transform: translateY(-6px); border-color: var(--primary); box-shadow: 0 12px 30px rgba(0, 255, 255, 0.12); }
    .service-card .emoji { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; }
    .service-card .name { font-weight: 700; letter-spacing: 0.02em; }

    footer { padding: 3rem 0; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.06); color: #888; font-size: 0.85rem; }
    footer .logo { font-size: 1rem; margin-bottom: 0.5rem; }

    @media (max-width: 640px) { .hero h1 { font-size: 2.75rem; } .ai-text-generator { font-size: 1.6rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <nav>
    <div class="logo">SOLOPASS</div>
    <a href="#services">Explore ▸</a>
  </nav>

  <section id="home" class="hero">
    <div id="particles-js"></div>
    <div class="hero-content">
      <h1>Solopass</h1>
      <div id="ai-text-generator" class="ai-text-generator"><span></span></div>
      <a href="#services" class="cta-button">Explore Our Services</a>
    </div>
  </section>

  <section id="services" class="services">
    <div class="container">
      <h2>What Solopass Does</h2>
      <div class="services-grid" id="services-grid"></div>
    </div>
  </section>

  <footer>
    <div class="logo">SOLOPASS</div>
    <div>An early animated landing-page experiment · preserved as v1</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    const services = [
      { name: "Photography", emoji: "📷", altEmoji: "📸" },
      { name: "Virtual Tours", emoji: "🥽", altEmoji: "🌐" },
      { name: "AI Workflow Consulting", emoji: "🤖", altEmoji: "🧠" },
      { name: "Image Generation", emoji: "🎨", altEmoji: "🖼️" },
      { name: "Music Generation", emoji: "🎵", altEmoji: "🎼" },
      { name: "GPT Integration", emoji: "💬", altEmoji: "🗨️" },
      { name: "Coaching", emoji: "🏋️", altEmoji: "📈" },
      { name: "Efficiency Diagnostics", emoji: "📊", altEmoji: "⚡" },
      { name: "Programming Consulting", emoji: "💻", altEmoji: "👨‍💻" }
    ];

    // Particle field (inline config — the original referenced a missing particles.json)
    if (window.particlesJS) {
      particlesJS('particles-js', {
        particles: {
          number: { value: 55, density: { enable: true, value_area: 800 } },
          color: { value: ['#00FFFF', '#FF00FF', '#FFFF00'] },
          shape: { type: 'circle' },
          opacity: { value: 0.5, random: true },
          size: { value: 3, random: true },
          line_linked: { enable: true, distance: 150, color: '#00FFFF', opacity: 0.25, width: 1 },
          move: { enable: true, speed: 2, direction: 'none', out_mode: 'out' }
        },
        interactivity: {
          detect_on: 'canvas',
          events: { onhover: { enable: true, mode: 'grab' }, onclick: { enable: true, mode: 'push' }, resize: true },
          modes: { grab: { distance: 140, line_linked: { opacity: 0.6 } }, push: { particles_nb: 3 } }
        },
        retina_detect: true
      });
    }

    // Smooth scroll
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const t = document.querySelector(this.getAttribute('href'));
        if (t) t.scrollIntoView({ behavior: 'smooth' });
      });
    });

    // Services grid
    const grid = document.getElementById('services-grid');
    services.forEach(s => {
      const card = document.createElement('div');
      card.className = 'service-card';
      card.innerHTML = `<span class="emoji">${s.emoji}</span><span class="name">${s.name}</span>`;
      grid.appendChild(card);
    });

    // Typewriter reel
    const aiTextGenerator = document.getElementById('ai-text-generator').querySelector('span');
    let currentIndex = 0, currentText = '', isDeleting = false, isPaused = false;

    function typeEffect() {
      if (isPaused) return;
      const fullText = services[currentIndex].name;
      currentText = isDeleting ? fullText.substring(0, currentText.length - 1) : fullText.substring(0, currentText.length + 1);
      aiTextGenerator.textContent = currentText;
      let typeSpeed = 50;
      if (isDeleting) typeSpeed /= 2;
      if (!isDeleting && currentText === fullText) {
        typeSpeed = 2000; isDeleting = true;
        showEmoji(services[currentIndex].emoji, services[currentIndex].altEmoji);
      } else if (isDeleting && currentText === '') {
        isDeleting = false; currentIndex = (currentIndex + 1) % services.length; typeSpeed = 500;
      }
      setTimeout(typeEffect, typeSpeed);
    }

    function showEmoji(emoji, altEmoji) {
      const el = document.createElement('div');
      el.textContent = emoji; el.className = 'floating-emoji';
      el.style.left = `${Math.random() * (window.innerWidth - 50)}px`;
      el.style.top = `${Math.random() * (window.innerHeight - 50)}px`;
      el.style.animation = 'float 5s ease-in-out infinite';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 9000); // don't let emojis pile up forever
      let isAlternate = false, clickCount = 0;
      el.addEventListener('mouseover', () => { el.style.animation = 'pulse 0.5s infinite'; });
      el.addEventListener('mouseout', () => { el.style.animation = 'float 5s ease-in-out infinite'; });
      el.addEventListener('click', () => {
        clickCount++; isAlternate = !isAlternate;
        el.textContent = isAlternate ? altEmoji : emoji;
        const anims = ['float 5s ease-in-out infinite', 'spin 1s linear infinite', 'bounce 1s ease infinite', 'shake 0.5s ease infinite'];
        el.style.animation = anims[clickCount % 4];
      });
    }

    typeEffect();

    const gen = document.getElementById('ai-text-generator');
    gen.addEventListener('mouseover', () => { isPaused = true; gen.style.color = 'var(--primary)'; });
    gen.addEventListener('mouseout', () => { isPaused = false; gen.style.color = 'var(--text)'; typeEffect(); });
  </script>
</body>
</html>
